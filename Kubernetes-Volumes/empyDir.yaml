apiVersion: v1
kind: Pod
metadata:
  name: emptydir-practice
spec:
  containers:
    - name: writer-container-1
      image: busybox
      command: ["/bin/sh", "-c", "echo 'Hello jeeva!' > /data/message.txt && sleep 300"]
      volumeMounts:
        - name: shared-data
          mountPath: /data

    - name: reader-container-2
      image: busybox
      command: ["/bin/sh", "-c", "cat /data/message.txt && sleep 300"]
      volumeMounts:
        - name: shared-data
          mountPath: /data

  volumes:
    - name: shared-data
      emptyDir: {}