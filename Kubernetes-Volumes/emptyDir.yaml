apiVersion: v1
kind: Pod
metadata:
  name: emptydir-sidecar-demo
spec:
  containers:
  - name: app-writer
    image: busybox
    command: ["/bin/sh", "-c", "while true; do echo $(date) - App log entry >> /shared-logs/app.log; sleep 5; done"]
    volumeMounts:
    - name: shared-storage
      mountPath: /shared-logs
  - name: log-reader-sidecar
    image: busybox
    command: ["/bin/sh", "-c", "tail -f /shared-logs/app.log"]
    volumeMounts:
    - name: shared-storage
      mountPath: /shared-logs
  volumes:
  - name: shared-storage
    emptyDir: {}