apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-qa
  namespace: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-qa
  template:
    metadata:
      labels:
        app: nginx-qa
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80