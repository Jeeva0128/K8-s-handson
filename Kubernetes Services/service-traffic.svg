<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Service traffic paths</title>
  <desc id="desc">A client reaches Nginx Pods through ClusterIP, NodePort, or LoadBalancer service exposure.</desc>
  <style>
    .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 10; }
    .blue { fill: #eff6ff; stroke: #2563eb; }
    .green { fill: #f0fdf4; stroke: #16a34a; }
    .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#m); }
    text { font-family: sans-serif; fill: #0f172a; }
    .head { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .body { font-size: 14px; text-anchor: middle; }
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <rect width="900" height="270" fill="#fff"/>
  <text x="450" y="32" class="head">One Nginx workload, three Service entry points</text>
  <rect x="30" y="95" width="155" height="75" class="box"/><text x="107" y="125" class="head">Client</text><text x="107" y="149" class="body">Pod or browser</text>
  <rect x="250" y="55" width="170" height="55" class="blue"/><text x="335" y="88" class="head">ClusterIP</text>
  <rect x="250" y="125" width="170" height="55" class="blue"/><text x="335" y="158" class="head">NodePort</text>
  <rect x="250" y="195" width="170" height="55" class="blue"/><text x="335" y="228" class="head">LoadBalancer</text>
  <rect x="575" y="85" width="260" height="100" class="green"/>
  <text x="705" y="118" class="head">Service selector</text><text x="705" y="145" class="body">app: nginx</text><text x="705" y="168" class="body">Nginx Pod endpoints</text>
  <path d="M185 130 H235 V83 H245" class="arrow"/><path d="M185 132 H245 V153" class="arrow"/><path d="M185 140 H235 V223 H245" class="arrow"/>
  <path d="M420 83 H565" class="arrow"/><path d="M420 153 H565" class="arrow"/><path d="M420 223 H565 V175" class="arrow"/>
</svg>
