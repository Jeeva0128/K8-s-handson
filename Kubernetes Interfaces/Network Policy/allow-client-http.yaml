apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-http
  namespace: server
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: client
      ports:
        - protocol: TCP
          port: 80
