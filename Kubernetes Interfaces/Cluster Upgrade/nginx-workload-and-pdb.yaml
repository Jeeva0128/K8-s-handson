apiVersion: v1
kind: Namespace
metadata:
  name: upgrade-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: upgrade-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
  namespace: upgrade-lab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nginx
