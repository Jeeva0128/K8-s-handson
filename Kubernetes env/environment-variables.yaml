apiVersion: v1
kind: Pod
metadata:
  name: env-demo
  labels:
    app: env-demo
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "APP_ENV=${APP_ENV}"
          echo "LOG_LEVEL=${LOG_LEVEL}"
          echo "POD_NAME=${POD_NAME}"
          sleep 3600
      env:
        - name: APP_ENV
          value: development
        - name: LOG_LEVEL
          value: info
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
