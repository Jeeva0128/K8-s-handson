apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-pod-deployment
  namespace: dev
  labels:
    app: apache
    environment: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: apache
      environment: dev

  template:
    metadata:
      labels:
        app: apache
        environment: dev

    spec:
      containers:
        - name: apache-dev-container
          image: httpd:2.4
          ports:
            - containerPort: 80
              protocol: TCP

        - name: jenkins-dev-container
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080
              protocol: TCP